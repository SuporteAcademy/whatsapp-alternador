<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coimbra Academy - Contato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e, #0d47a1, #01579b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('images/pattern.png');
            opacity: 0.1;
            z-index: 1;
        }

        .container {
            background: linear-gradient(135deg, rgba(35,39,47,0.95) 60%, rgba(60,65,80,0.85) 100%);
            padding: 8px 30px 32px 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px 0 rgba(0,0,0,0.35), 0 1.5px 6px 0 rgba(0,0,0,0.10);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 40px;
            margin-top: 8px;
        }

        .whatsapp-button {
            display: inline-block;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.3);
        }

        .whatsapp-button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0d47a1, #01579b);
            box-shadow: 0 8px 20px rgba(26, 35, 126, 0.4);
        }

        .whatsapp-button i {
            font-size: 24px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 10px 24px 10px;
            }
            .logo {
                width: 180px;
                margin-bottom: 24px;
            }
            .whatsapp-button {
                padding: 15px 20px;
                font-size: 18px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <img src="images/logo.png" alt="Coimbra Academy Logo" class="logo">
        <button class="whatsapp-button" id="whatsappButton">
            <i class="fab fa-whatsapp"></i>
            Falar com Consultor
        </button>
    </div>

    <script>
        // Lista de números de WhatsApp
        const numeros = [
            '558581141843',
            '558596391843'
        ];

        // Variável global para controlar qual número será usado
        let numeroAtual;

        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Função que roda quando a página carrega
        window.onload = function() {
            // Usa os milissegundos atuais para determinar o número
            const timestamp = new Date().getTime();
            // Alterna entre 0 e 1 baseado nos milissegundos
            const indice = (timestamp % 2);
            numeroAtual = numeros[indice];
            
            console.log('Timestamp:', timestamp, 'Índice:', indice, 'Número definido:', numeroAtual);
        };

        const whatsappButton = document.getElementById('whatsappButton');

        whatsappButton.addEventListener('click', function() {
            if (isMobile()) {
                // Se for dispositivo móvel, usa o link wa.me
                window.open(`https://wa.me/${numeroAtual}`, '_blank');
            } else {
                // Se for desktop, abre direto o WhatsApp Web
                window.open(`https://web.whatsapp.com/send?phone=${numeroAtual}`, '_blank');
            }
        });
    </script>
</body>
</html>
