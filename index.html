<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coimbra Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        .whatsapp-button {
            display: inline-block;
            background-color: #1a237e;
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .whatsapp-button:hover {
            transform: scale(1.05);
            background-color: #0d47a1;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.4);
        }

        .whatsapp-button i {
            font-size: 24px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Coimbra Academy</h1>
        <button class="whatsapp-button" id="whatsappButton">
            <i class="fab fa-whatsapp"></i>
            Falar com Consultor
        </button>
    </div>

    <script>
        // Lista de números de WhatsApp
        const numeros = [
            '558581141843',
            '558596391843'
        ];

        let indiceAtual = 0;
        const whatsappButton = document.getElementById('whatsappButton');

        function getProximoNumero() {
            const numero = numeros[indiceAtual];
            indiceAtual = (indiceAtual + 1) % numeros.length;
            return numero;
        }

        whatsappButton.addEventListener('click', function() {
            const numero = getProximoNumero();
            window.open(`https://wa.me/${numero}`, '_blank');
        });
    </script>
</body>
</html>
